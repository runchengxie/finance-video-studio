site_name: Finance Video Studio
site_url: https://runchengxie.github.io/finance-video-studio/
repo_url: https://github.com/runchengxie/finance-video-studio
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.top
exclude_docs: |
  superpowers/
  requirements.in
  requirements.txt
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: 财经视频制作工具
          theme:
            palette:
              - toggle:
                  name: 切换到浅色模式
              - toggle:
                  name: 切换到深色模式
              - toggle:
                  name: 跟随系统设置
          nav_translations:
            Home: 首页
            Demo and development: 示例与开发
            Manuscript review: 文稿审阅
            Editorial review brief: 稿件审阅提示词
            Production tools: 制作工具
            Production rendering: 视频生成
            Production workflow: 制作流程
            Complete delivery: 完整交付
            Portrait and review: 竖版与审阅
            Narration comparison: 旁白版本比较
            Broadcast template: 栏目模板
            Local voice: 本机配音
            Historical adoption: 历史迁移
            Data layout: 数据目录
            Repository structure: 项目结构
            Third-party notices: 第三方说明
            Validation: 验证记录
nav:
  - Home: index.md
  - Demo and development: demo.md
  - Manuscript review: manuscript-review.md
  - Editorial review brief: editorial-review.md
  - Production tools: production-tools.md
  - Production rendering: production-rendering.md
  - Production workflow: production-workflow.md
  - Complete delivery: production-delivery.md
  - Portrait and review: production-advanced.md
  - Narration comparison: narration-comparison.md
  - Broadcast template: broadcast-template.md
  - Local voice: local-voice.md
  - Historical adoption: historical-adoption.md
  - Data layout: data-layout.md
  - Repository structure: repository-structure.md
  - Third-party notices: third-party.md
  - Validation: validation.md
