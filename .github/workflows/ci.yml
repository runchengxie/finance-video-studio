name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Provision pinned dependencies and browser
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Offline checks and actual video decode
        run: |
          sudo unshare --net -- runuser -u "$(id -un)" -- env HOME="$HOME" PATH="$PATH" bash -c 'test -z "$(ip route)" && npm run check && npm test && npm run smoke -- "$1" && npm run review:example -- "$2"' bash "$RUNNER_TEMP/finance-smoke" "$RUNNER_TEMP/review-example"
